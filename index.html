<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Booster HP</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 50px 20px; }
        .box { border: 2px solid #ff4757; padding: 20px; border-radius: 15px; background: #1e1e1e; }
        video { width: 100%; border-radius: 10px; background: #000; margin-top: 20px; border: 1px solid #333; }
        button { background: #ff4757; color: white; border: none; padding: 15px 25px; border-radius: 10px; font-weight: bold; margin-top: 20px; width: 100%; }
        ol { text-align: left; font-size: 14px; color: #ccc; }
    </style>
</head>
<body>

<div class="box">
    <h2>Zen Overlay HP</h2>
    <p>Ikuti langkah di bawah agar berhasil di Oppo:</p>
    <ol>
        <li>Klik tombol <b>"Putar & Siapkan"</b>.</li>
        <li>Tekan tombol <b>Full Screen</b> (kotak) pada video di bawah.</li>
        <li>Saat video sudah penuh, tekan tombol <b>HOME</b> (tengah) di HP kamu.</li>
    </ol>
    
    <video id="myVideo" controls playsinline></video>
    <button id="prepBtn">1. PUTAR & SIAPKAN</button>
</div>

<canvas id="myCanvas" width="480" height="270" style="display:none;"></canvas>

<script>
    const v = document.getElementById('myVideo');
    const c = document.getElementById('myCanvas');
    const ctx = c.getContext('2d');
    const btn = document.getElementById('prepBtn');

    const quotes = [
        "SEMANGAT TERUS!",
        "JANGAN MENYERAH!",
        "KAMU HEBAT!",
        "ISTIRAHAT SEJENAK",
        "FOKUS KE TUJUAN"
    ];

    function draw() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = "#ff4757";
        ctx.font = "bold 40px sans-serif";
        ctx.textAlign = "center";
        const text = quotes[Math.floor(Math.random() * quotes.length)];
        ctx.fillText(text, c.width/2, c.height/2 + 15);
    }

    const stream = c.captureStream(10);
    v.srcObject = stream;

    btn.addEventListener('click', () => {
        draw();
        v.play();
        alert("Sekarang tekan tombol Fullscreen di video, lalu tekan tombol HOME HP kamu.");
    });

    setInterval(draw, 10000);
</script>
</body>
</html>
